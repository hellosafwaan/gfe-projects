<html lang="en">

                </svg>
            </div>
          </div>
          <p class="input-group__hint" id="hint-default">This is a hint text.</p>
        </div>

        <!-- Icon Leading -->
        <div class="input-group input-group--icon-leading">
          <label class="input-group__label" for="input-icon-leading">Email</label>

              </svg>
            </div>
            <input class="input-group__input" id="input-icon-leading" aria-describedby="hint-icon-leading" type="text" placeholder="name@email.com">
            <div class="input-group__icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

            </div>
          </div>
          <p class="input-group__hint" id="hint-icon-leading">This is a hint text.</p>
        </div>

          <label class="input-group__label" for="input-disabled">Email</label>

            </div>

            </div>

        </div>
      </div>
