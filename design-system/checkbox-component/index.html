<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="container">
      <div class="checkbox__items">
        <label class="checkbox" for="checkbox-one">
          <input class="checkbox__input" type="checkbox" id="checkbox-one">
          <span class="checkbox__box"></span>
          <span class="checkbox__label">Unchecked</span>
        </label>
        <label class="checkbox" for="checkbox-two">
          <input class="checkbox__input" type="checkbox" id="checkbox-two" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__label">Checked</span>
        </label>
        <label class="checkbox" for="checkbox-three">
          <input class="checkbox__input" type="checkbox" id="checkbox-three" >
          <span class="checkbox__box"></span>
          <span class="checkbox__label">Indeterminate</span>
        </label>
      </div>
    </div>
    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a
        href="https://www.greatfrontend.com/projects?ref=challenges"
        target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a
        href="https://www.greatfrontend.com/projects/u/hellosafwaan"
        target="_blank"
        >Safwaan</a
      >.
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
