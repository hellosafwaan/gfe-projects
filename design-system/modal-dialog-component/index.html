<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/button_styles.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="container">
      <button class="btn btn--primary btn--md trigger-button">Trigger Modal</button>
      <div class="credits" data-gfe-screenshot-exclude="true">
        A challenge by
        <a
          href="https://www.greatfrontend.com/projects?ref=challenges"
          target="_blank"
          >GreatFrontEnd Projects</a
        >. Built by
        <a
          href="https://www.greatfrontend.com/projects/u/hellosafwaan"
          target="_blank"
          >Safwaan</a
        >.
      </div>
    </div>
    <div class="modal-overlay">
      <div 
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        id="modal"
      >
        <div class="modal__content">
          <div class="modal__header">
            <p class="modal__title" id="modal-title">Are you sure you want to leave the process?</p>
            <button class="btn btn--link-gray btn--2xl btn--icon-only modal__close" aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.0006 8.82208L14.1253 4.69727L15.3038 5.87577L11.1791 10.0006L15.3038 14.1253L14.1253 15.3038L10.0006 11.1791L5.87577 15.3038L4.69727 14.1253L8.82208 10.0006L4.69727 5.87577L5.87577 4.69727L10.0006 8.82208Z" fill="#525252"/>
              </svg>
            </button>
          </div>
          <p class="modal__description" id="modalDescription">Your upgrade plan process will be cancelled. You need to start again if you leave the process.</p>
        </div>
        <div class="modal__actions">
          <button class="btn btn--secondary btn--lg" id="modalCancelAction" >No</button>
          <button class="btn btn--primary btn--lg" id="modalPrimaryAction">Yes</button>
        </div>
      </div>
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
