<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="container">
      <div id="toast-demo" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast toast--success">
          <span class="toast__badge">Success</span>
          <p class="toast__message">Your content successfully added!</p>
        </div>
      </div>
      <div class="toast-items">
        <div class="toast toast--success">
          <span class="toast__badge">Success</span>
          <p class="toast__message">Your content successfully added!</p>
        </div>
        <div class="toast toast--error">
          <span class="toast__badge">Error</span>
          <p class="toast__message">Your content successfully deleted!</p>
        </div>
        <div class="toast toast--warning">
          <span class="toast__badge">Warning</span>
          <p class="toast__message">Your image is 5Mb, it may load longer!</p>
        </div>
        <div class="toast toast--info">
          <span class="toast__badge">Info</span>
          <p class="toast__message">Your content is publicly visible</p>
        </div>
      </div>
    </div>
    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a
        href="https://www.greatfrontend.com/projects?ref=challenges"
        target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a
        href="https://www.greatfrontend.com/projects/u/hellosafwaan"
        target="_blank"
        >Safwaan</a
      >.
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
