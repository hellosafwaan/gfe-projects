<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="container">
      <div class="toggle-boxes">
        <div class="toggle-boxes-column">
          <label class="toggle toggle--sm" for="switch-1">
            <input id="switch-1" type="checkbox" role="switch" name="switch-1" value="switch-1">
            <span class="toggle-track"></span>
          </label>
          <label class="toggle toggle--md" for="switch-2">
            <input id="switch-2" type="checkbox" role="switch" name="switch-2" value="switch-2">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="toggle-boxes-column">
          <label class="toggle toggle--sm" for="switch-3">
            <input id="switch-3" type="checkbox" role="switch" name="switch-3" value="switch-3" checked>
            <span class="toggle-track"></span>
          </label>
          <label class="toggle toggle--md" for="switch-4">
            <input id="switch-4" type="checkbox" role="switch" name="switch-4" value="switch-4" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>
    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a
        href="https://www.greatfrontend.com/projects?ref=challenges"
        target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a
        href="https://www.greatfrontend.com/projects/u/hellosafwaan"
        target="_blank"
        >Safwaan</a
      >.
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
