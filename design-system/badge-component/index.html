<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badge Components| GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>
  <body>
    <div class="container">
      <div class="badges">
        <div class="badges__row">
          <span class="badge badge--neutral badge--sm">Label</span>
          <span class="badge badge--neutral badge--md">Label</span>
          <span class="badge badge--neutral badge--lg">Label</span>
        </div>
        <div class="badges__row">
          <span class="badge badge--error badge--sm">Label</span>
          <span class="badge badge--error badge--md">Label</span>
          <span class="badge badge--error badge--lg">Label</span>
        </div>
        <div class="badges__row">
          <span class="badge badge--warning badge--sm">Label</span>
          <span class="badge badge--warning badge--md">Label</span>
          <span class="badge badge--warning badge--lg">Label</span>
        </div>
        <div class="badges__row">
          <span class="badge badge--success badge--sm">Label</span>
          <span class="badge badge--success badge--md">Label</span>
          <span class="badge badge--success badge--lg">Label</span>
        </div>
          <div class="badges__row">
          <span class="badge badge--brand badge--sm">Label</span>
          <span class="badge badge--brand badge--md">Label</span>
          <span class="badge badge--brand badge--lg">Label</span>
        </div>
      </div>
      <div class="credits">
        A challenge by
        <a
          href="https://www.greatfrontend.com/projects?ref=challenges"
          target="_blank"
          >GreatFrontEnd Projects</a
        >. Built by
        <a href="https://www.greatfrontend.com/u/hellosafwaan" target="_blank"
          >Safwaan</a
        >.
      </div>
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
